[package]
name = "orion-vm"
# Única fuente de la versión: banner, doctor, REPL y `--version` la leen con
# env!("CARGO_PKG_VERSION"). Al publicar, el tag vX.Y.Z debe coincidir.
version = "0.1.3"
edition = "2021"
description = "Orion Language Virtual Machine"
build = "build.rs"

[lib]
name = "orion_vm"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "orion"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"
indexmap = { version = "2", features = ["serde"] }
rand = "0.8"
chrono = "0.4"
regex = "1"
sha2 = "0.10"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif"] }

# ── Cranelift JIT ─────────────────────────────────────────────────────────────
cranelift-codegen  = { version = "0.113", default-features = false, features = ["std"] }
cranelift-frontend = "0.113"
cranelift-jit      = "0.113"
cranelift-module   = "0.113"
cranelift-native   = "0.113"
cranelift-object   = "0.113"

# ── FFI dinámico ──────────────────────────────────────────────────────────────
libloading = "0.8"
libffi       = "3"
base64       = "0.21"

# ── GUI nativa (orion-gui) ────────────────────────────────────────────────────
egui      = "0.29"
eframe    = "0.29"
egui_plot = "0.29"

# ── TUI terminal (orion-tui) ──────────────────────────────────────────────────
ratatui   = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# ── Data processing ───────────────────────────────────────────────────────────
rayon          = "1"                                 # frame: agregaciones data-parallel
nalgebra       = "0.33"                              # matrix: motor HPC (mul tipo BLAS, LU, eig, SVD)
csv            = "1"
calamine       = "0.36"
rust_xlsxwriter = "0.74"

# ── Base de datos ─────────────────────────────────────────────────────────────
rusqlite = { version = "0.31", features = ["bundled"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
rust_decimal = { version = "1", features = ["db-postgres"] }
uuid = "1"
bytes = "1"
mysql = "25"

# ── Autenticación ─────────────────────────────────────────────────────────────
argon2       = "0.5"
jsonwebtoken = "9"

# ── Correo electrónico ────────────────────────────────────────────────────────
lettre = { version = "0.11", features = ["smtp-transport", "rustls-tls", "builder"] }

# ── WebSocket ─────────────────────────────────────────────────────────────────
tungstenite = "0.24"

# ── Templates ─────────────────────────────────────────────────────────────────
minijinja = "2"

# ── Tablas formateadas ────────────────────────────────────────────────────────
comfy-table = "7"

# ── Grafos ────────────────────────────────────────────────────────────────────
petgraph = "0.6"

# ── PDF ───────────────────────────────────────────────────────────────────────
lopdf     = "0.42"
printpdf  = "0.6"

# ── Bloque D ──────────────────────────────────────────────────────────────────
toml    = "0.8"                                      # config_mod: parseo TOML
zip     = "2"                                        # zip_mod: crear/extraer .zip
flate2  = "1"                                        # zip_mod: gzip/gunzip
aes-gcm = "0.10"                                     # crypto2_mod + crypto_mod: AES-256-GCM
rsa     = { version = "0.9", features = ["pem", "sha2"] }  # crypto2_mod: RSA + PEM + SHA2 OID
subtle  = "2.5"                                      # crypto_mod: comparación en tiempo constante
md-5    = "0.10"                                     # crypto_mod: MD5 real (checksums, no seguridad)

# ── Bloque E — Cloud native ────────────────────────────────────────────────────
ssh2 = "0.9"                                         # ssh_mod: SSH/SCP (libssh2)

# ── Bytecode binario ──────────────────────────────────────────────────────────
bincode = "1.3"                                      # bytecode: serialización binaria eficiente
ocrs = "0.12.2"
rten = "0.24.0"
rten-imageproc = "0.24.0"
pdf-extract = "0.12.0"
imageproc = "0.27.0"
pdfium-render = "0.9.3"

[build-dependencies]
embed-resource = "2"                                 # embebe orion.rc (manifest UTF-8) en el .exe
