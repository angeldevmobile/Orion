name: Release Binaries

# Compila el binario `orion` en los 4 objetivos nativos y, en un tag vX.Y.Z,
# crea un GitHub Release con los binarios adjuntos (descarga directa del CLI).
# Con disparo manual (workflow_dispatch) solo sube los binarios como artefactos
# (útil para probar la compilación sin crear un Release).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # El tag y la versión del paquete tienen que decir lo mismo.
  #
  # `v0.1.4` se publicó conteniendo `0.1.3`, así que el binario que la gente
  # descargaba anunciaba una versión que no era la suya — y `--version` es
  # justo lo que se mira para saber si un fallo ya está arreglado. Esto falla
  # antes de compilar nada, en vez de descubrirlo cuando ya está publicado.
  # El job corre SIEMPRE (no lleva `if`): un job que depende de otro saltado se
  # salta también, y eso dejaría sin compilar el disparo manual. Lo que se
  # omite es la comprobación, no el job.
  version:
    name: el tag coincide con Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparar tag y versión del paquete
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "No es un tag: no hay nada que comparar."; exit 0 ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version' orion-vm/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag  Cargo.toml=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::El tag v$tag no coincide con la versión $pkg de orion-vm/Cargo.toml."
            echo "::error::Sube la versión en Cargo.toml y vuelve a taguear."
            exit 1
          fi

  build:
    name: build (${{ matrix.target_dir }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_dir: win32-x64
            bin_name: orion.exe
            asset: orion-win32-x64.exe
          # ubuntu-22.04 y NO ubuntu-latest: un binario enlazado contra glibc
          # exige en destino una versión igual o más nueva que la de la
          # máquina donde se compiló. `ubuntu-latest` es 24.04 (glibc 2.39), y
          # con eso el binario no arranca en Debian 12 (2.36) ni en Ubuntu
          # 22.04: "version GLIBC_2.39 not found". Compilando en 22.04
          # (glibc 2.35) funciona en todas ellas y en las más nuevas.
          - os: ubuntu-22.04
            target_dir: linux-x64
            bin_name: orion
            asset: orion-linux-x64
          - os: macos-14            # Apple Silicon (arm64)
            target_dir: darwin-arm64
            bin_name: orion
            asset: orion-darwin-arm64

    defaults:
      run:
        working-directory: orion-vm

    steps:
      - uses: actions/checkout@v4

      # ── Dependencias de sistema (C nativo: libssh2, libffi, openssl, X11 para egui) ──
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libffi-dev libssl-dev libssh2-1-dev \
            libx11-dev libxcb-composite0-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libssh2 libffi openssl@3 pkg-config

      # Windows: rusqlite usa SQLite bundled (MSVC), egui no necesita X11.
      # Si ssh2/openssl-sys fallan, descomenta vcpkg:
      # - name: Setup vcpkg (Windows)
      #   if: runner.os == 'Windows'
      #   run: vcpkg install openssl:x64-windows-static-md

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            orion-vm/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('orion-vm/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --bin orion

      - name: Smoke test (--version)
        run: ./target/release/${{ matrix.bin_name }} --version
        shell: bash

      # Renombra el binario a un nombre único por plataforma para el Release.
      - name: Rename binary
        shell: bash
        run: cp "target/release/${{ matrix.bin_name }}" "target/release/${{ matrix.asset }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: orion-${{ matrix.target_dir }}
          path: orion-vm/target/release/${{ matrix.asset }}
          if-no-files-found: error

  # Crea el GitHub Release y adjunta los 4 binarios. Solo en tags vX.Y.Z.
  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # necesario para crear el Release
    steps:
      - uses: actions/checkout@v4

      - name: Descargar todos los binarios
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Aplanar a dist/
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      # Las notas de la release salen del CHANGELOG, no de los asuntos de los
      # commits. Un commit dice "cambios en cdp"; el CHANGELOG dice que `crawl`
      # perdía filas al reanudar y qué se hizo. Lo segundo es lo que alguien
      # necesita para decidir si actualizar.
      #
      # Se extrae la sección de esta versión: desde `## vX.Y.Z` hasta el
      # siguiente `## `. Si no la encuentra —una versión sin entrada— sigue
      # adelante con el texto de siempre en vez de tumbar la publicación.
      - name: Preparar las notas desde el CHANGELOG
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## v" v "([^0-9]|$)" { dentro = 1; next }
            dentro && /^## / { exit }
            dentro { print }
          ' CHANGELOG.md > seccion.md

          if [ -s seccion.md ]; then
            cat seccion.md > notas.md
            echo "" >> notas.md
          else
            echo "::warning::No hay sección para v$version en CHANGELOG.md; se publica sin notas detalladas."
            echo "Binarios del CLI de Orion para $GITHUB_REF_NAME." > notas.md
            echo "" >> notas.md
          fi

          cat >> notas.md <<'PIE'
          ---

          ### Descargas

          | Plataforma | Archivo |
          |---|---|
          | Windows x64 | `orion-win32-x64.exe` |
          | macOS (Apple Silicon) | `orion-darwin-arm64` |
          | Linux x64 | `orion-linux-x64` |

          En macOS y Linux: `chmod +x orion-*` antes de ejecutarlo.
          Comprueba cuál tienes con `orion --version`.
          PIE

          echo "--- notas.md ---"; cat notas.md

      - name: Crear GitHub Release con los binarios
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: notas.md
