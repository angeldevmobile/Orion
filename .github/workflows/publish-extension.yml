name: Publish Extension

# Genera un .vsix POR PLATAFORMA (cada uno con su binario orion nativo) y,
# si se marca "publish", los sube al VS Code Marketplace.
#
# Requiere (solo para publicar): secret VSCE_PAT — Personal Access Token de
# Azure DevOps con scope Marketplace → Manage (Settings → Secrets → Actions).
#
# Disparo manual: Actions → Publish Extension → Run workflow.
# Marca "publish" para subir al Marketplace; sin marcar solo genera los .vsix
# como artefactos descargables (útil para probar antes de publicar).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar al Marketplace (si no, solo genera los .vsix)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: vsix (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-14            # Apple Silicon (arm64)
            target: darwin-arm64
          - os: macos-13            # Intel
            target: darwin-x64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Dependencias de sistema (igual que release.yml) ──
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libffi-dev libssl-dev libssh2-1-dev \
            libx11-dev libxcb-composite0-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libssh2 libffi openssl@3 pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            orion-vm/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('orion-vm/Cargo.lock') }}

      - name: Build orion (release)
        working-directory: orion-vm
        run: cargo build --release --bin orion

      - name: Smoke test
        working-directory: orion-vm
        run: ./target/release/orion --version
        shell: bash

      # ── Empaquetar la extensión con el binario de ESTA plataforma ──
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install extension deps
        working-directory: vscode-orion/orion-lang
        run: npm ci

      - name: Copy platform binary into bin/
        working-directory: vscode-orion/orion-lang
        run: npm run copy-bin

      - name: Package .vsix
        working-directory: vscode-orion/orion-lang
        run: npx @vscode/vsce package --target ${{ matrix.target }}

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-lang-${{ matrix.target }}
          path: vscode-orion/orion-lang/*.vsix
          if-no-files-found: error

      # ── Publicación al Marketplace (solo con el checkbox marcado) ──
      - name: Publish to Marketplace
        if: ${{ inputs.publish }}
        working-directory: vscode-orion/orion-lang
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --target ${{ matrix.target }} --packagePath *.vsix
        shell: bash
